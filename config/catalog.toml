[tables."catalog.datasets"]
description = "One row per Delta table: what it is, its scope and isolation column, keys, load and write pattern, personal data and sources."
scope = "PLATFORM"
primary_key = ["table_name"]
load_pattern = "derived"
upstream = []
transformation = "Generated from config/catalog.toml at the end of every run."

[tables."catalog.datasets".columns]
layer = "bronze, silver, gold, graph, catalog or platform."
description = "What the table holds, in business terms."
scope = "TENANT, GLOBAL or PLATFORM."
tenant_column = "Column that defines isolation; null for global and platform tables."
primary_key = "Columns of the table's grain."
partition_columns = "Partitioning, if any."
load_pattern = "snapshot, incremental, reference, derived or operational."
write_pattern = "How the pipeline writes the table."
contains_personal_data = "Whether the table holds personal data."
personal_data_columns = "Columns that hold personal data."
source_objects = "Source objects the table ultimately comes from."
storage_location = "Path of the Delta table, relative to the repository."

[tables."catalog.columns"]
description = "One row per table and column, read from the Delta schema, with its description and flags."
scope = "PLATFORM"
primary_key = ["table_name", "column_name"]
load_pattern = "derived"
upstream = ["catalog.datasets"]
transformation = "Delta schemas of the existing tables, with descriptions from config/catalog.toml."

[tables."catalog.columns".columns]
column_name = "Column name."
ordinal = "Position of the column in the table."
data_type = "Spark SQL type."
nullable = "Whether the column accepts nulls."
description = "What the column holds."
is_key = "Part of the table's primary key."
is_tenant_column = "The column that defines isolation."
is_partition_column = "The table is partitioned by this column."
is_personal_data = "The column holds personal data; its values never appear in the catalog."

[tables."catalog.lineage"]
description = "One row per upstream and downstream pair, from source objects to bronze, silver, gold and graph."
scope = "PLATFORM"
primary_key = ["upstream", "downstream"]
load_pattern = "derived"
upstream = ["catalog.datasets"]
transformation = "The upstream lists of config/catalog.toml, at table level."

[tables."catalog.lineage".columns]
upstream = "Upstream table or source object."
upstream_type = "table or source_object."
upstream_system = "System of a source object (ERP, Partner API, Open Food Facts, Open Prices)."
downstream = "Table built from the upstream."
transformation = "How the downstream table is built."

[tables."catalog.freshness"]
description = "Freshness of every table per processed window: the run that processed it, rows, load time and public snapshot date."
scope = "PLATFORM"
primary_key = ["table_name", "window_id"]
load_pattern = "derived"
upstream = ["catalog.datasets", "platform.run_log"]
transformation = "Row counts per window from each table, run attributes from the run log, snapshot dates from the landing manifests."

[tables."catalog.freshness".columns]
window_id = "Processed window."
scope = "Scope of the table."
row_count = "Rows attributed to the window, or the whole table when it has no window column."
rows_scope = "window, table or runs (run log tables, not counted): what row_count counts."
source_snapshot_date = "For global tables, the snapshot date of their public sources as of the window."
refreshed_in = "For global tables, the window or reference load that last refreshed them."
fallback_used = "Whether the window's run used a fallback for a public source."
run_id = "Latest successful run of the window (volatile)."
run_status = "Status of that run (volatile)."
run_finished_at = "When that run finished: the load time (volatile)."
last_loaded_at = "Latest load time of the rows counted (volatile)."
